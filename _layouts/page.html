---
layout: default
---
<article class="wrap narrow page">
  <header class="page-head">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
